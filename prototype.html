<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Star Fidget — Tuner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #0a0612;
    color: #d4cce0;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    position: relative;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  .stage {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 35%, #2a1f44 0%, #140a24 60%, #050208 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arena {
    position: relative;
    border-radius: 24px;
    background:
      radial-gradient(ellipse at 50% 40%, #1a1230 0%, #0d0820 70%, #050210 100%);
    box-shadow:
      0 0 0 1px rgba(140, 110, 200, 0.18) inset,
      0 0 60px rgba(80, 60, 140, 0.25) inset;
    overflow: hidden;
  }
  .arena::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 18px;
    background-image:
      linear-gradient(rgba(140, 110, 200, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 110, 200, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  canvas {
    position: absolute;
    left: 0; top: 0;
    cursor: grab;
    touch-action: none;
  }
  canvas.grabbing { cursor: grabbing; }

  .hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0.55;
    line-height: 1.6;
    pointer-events: none;
    width: 100%;
  }
  .hint strong { color: #6dd9a0; font-weight: 500; }
  .hint em     { color: #b89dd9; font-style: normal; }

  /* ——— Open-tool button (shown only when tool window is hidden) ——— */
  .tool-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 30;
    width: 44px;
    height: 44px;
    border-radius: 22px;
    background: rgba(20, 10, 36, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(140, 110, 200, 0.25);
    color: #d4cce0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, opacity 0.18s;
  }
  .tool-toggle:hover {
    background: rgba(40, 25, 70, 0.85);
    border-color: rgba(109, 217, 160, 0.5);
  }
  .tool-toggle svg { width: 20px; height: 20px; }
  .tool-toggle.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ——— Floating tool window ——— */
  .panel {
    position: absolute;
    /* Default position — JS overrides via top/left when dragged */
    top: 16px;
    right: 16px;
    width: 320px;
    max-height: calc(100vh - 32px);
    background: rgba(16, 10, 31, 0.92);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(140, 110, 200, 0.22);
    border-radius: 12px;
    z-index: 25;
    box-shadow:
      0 16px 48px rgba(0, 0, 0, 0.55),
      0 2px 0 rgba(255, 255, 255, 0.04) inset;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.18s, transform 0.18s;
  }
  .panel.hidden {
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
  }
  .panel.collapsed .panel-body { display: none; }

  /* Title bar — drag handle */
  .panel-titlebar {
    display: flex;
    align-items: center;
    padding: 10px 8px 10px 14px;
    background:
      linear-gradient(180deg, rgba(50, 35, 80, 0.6) 0%, rgba(30, 20, 50, 0.4) 100%);
    border-bottom: 1px solid rgba(140, 110, 200, 0.18);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    flex-shrink: 0;
  }
  .panel-titlebar.dragging { cursor: grabbing; }
  .panel-title {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    color: #d4cce0;
    letter-spacing: 0.04em;
  }
  .panel-title .grip-dots {
    display: inline-block;
    margin-right: 8px;
    color: rgba(180, 160, 220, 0.45);
    font-size: 10px;
    letter-spacing: 1px;
    vertical-align: 1px;
  }
  .panel-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: #b8acd0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 2px;
  }
  .panel-btn:hover {
    background: rgba(140, 110, 200, 0.15);
    color: #e8def5;
  }
  .panel-btn svg { width: 14px; height: 14px; }

  /* Body — scrollable */
  .panel-body {
    overflow-y: auto;
    padding: 14px 16px 20px;
    flex: 1;
    min-height: 0;
  }

  .panel h2 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #8a7aa8;
    margin: 18px 0 10px;
    font-weight: 600;
  }
  .panel h2:first-of-type { margin-top: 4px; }
  .panel .sub {
    font-size: 11px;
    color: #6a5d80;
    margin-bottom: 6px;
  }

  .row { margin-bottom: 18px; }
  .row label {
    font-size: 12px;
    color: #b8acd0;
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .row label .v {
    color: #6dd9a0;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  .row input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: #2a1f44;
    border-radius: 3px;
    outline: none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #6dd9a0;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(109, 217, 160, 0.18);
  }
  .row input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #6dd9a0;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 4px rgba(109, 217, 160, 0.18);
  }

  .toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 12px;
    color: #b8acd0;
    cursor: pointer;
  }
  .toggle input { display: none; }
  .toggle .sw {
    width: 32px; height: 18px;
    background: #2a1f44;
    border-radius: 10px;
    position: relative;
    transition: background 0.15s;
  }
  .toggle .sw::after {
    content: '';
    position: absolute;
    left: 2px; top: 2px;
    width: 14px; height: 14px;
    background: #8a7aa8;
    border-radius: 50%;
    transition: transform 0.15s, background 0.15s;
  }
  .toggle input:checked + .sw {
    background: rgba(109, 217, 160, 0.3);
  }
  .toggle input:checked + .sw::after {
    transform: translateX(14px);
    background: #6dd9a0;
  }

  .preset-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }
  .preset-row button {
    background: #1a1230;
    border: 1px solid #2a1f44;
    color: #b8acd0;
    padding: 8px;
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .preset-row button:hover {
    background: #2a1f44;
    color: #e8def5;
    border-color: #6dd9a0;
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="arena" id="arena">
      <canvas id="cv"></canvas>
    </div>
    <div class="hint">
      one finger to push · <strong>two fingers to twist</strong> · pinch out to extend
    </div>
  </div>

  <button class="tool-toggle" id="tool-toggle" aria-label="Show tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
  </button>

  <div class="panel" id="panel">
    <div class="panel-titlebar" id="panel-titlebar">
      <div class="panel-title"><span class="grip-dots">⋮⋮</span>Tuner</div>
      <button class="panel-btn" id="panel-collapse" aria-label="Collapse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="panel-btn" id="panel-hide" aria-label="Hide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body">
      <div class="sub">handle is a 2D joystick · rings respond as it moves</div>

      <h2>Joystick</h2>

      <div class="row">
        <label>float radius (lateral) <span class="v" id="v-float">60</span></label>
        <input type="range" id="float" min="0" max="160" step="2" value="60">
      </div>

      <div class="row">
        <label>max pull-up (vertical) <span class="v" id="v-pull">110</span></label>
        <input type="range" id="pull" min="20" max="220" step="2" value="110">
      </div>

    <div class="row">
      <label>ring follow strength <span class="v" id="v-follow">0.55</span></label>
      <input type="range" id="follow" min="0" max="1.2" step="0.02" value="0.55">
    </div>

    <div class="row">
      <label>follow falloff (outer rings move less) <span class="v" id="v-falloff">1.40</span></label>
      <input type="range" id="falloff" min="0.20" max="3.00" step="0.05" value="1.40">
    </div>

    <div class="row">
      <label>spring stiffness <span class="v" id="v-spring">0.18</span></label>
      <input type="range" id="spring" min="0.02" max="0.50" step="0.01" value="0.18">
    </div>

    <div class="row">
      <label>damping <span class="v" id="v-damp">0.78</span></label>
      <input type="range" id="damp" min="0.50" max="0.98" step="0.01" value="0.78">
    </div>

    <label class="toggle">
      <span>spring back when released</span>
      <input type="checkbox" id="spring-back" checked>
      <span class="sw"></span>
    </label>

    <h2>Shape</h2>

    <div class="row">
      <label>points <span class="v" id="v-points">10</span></label>
      <input type="range" id="points" min="3" max="20" step="1" value="10">
    </div>

    <div class="row">
      <label>inner ratio <span class="v" id="v-ratio">0.78</span></label>
      <input type="range" id="ratio" min="0.40" max="1.00" step="0.01" value="0.78">
    </div>

    <div class="row">
      <label>rings <span class="v" id="v-rings">28</span></label>
      <input type="range" id="rings" min="6" max="60" step="1" value="28">
    </div>

    <div class="row">
      <label>outer radius <span class="v" id="v-outer">170</span></label>
      <input type="range" id="outer" min="80" max="260" step="2" value="170">
    </div>

    <div class="row">
      <label>min radius <span class="v" id="v-min">22</span></label>
      <input type="range" id="min" min="4" max="80" step="1" value="22">
    </div>

    <div class="row">
      <label>spacing play <span class="v" id="v-play">1.10</span></label>
      <input type="range" id="play" min="0.40" max="2.00" step="0.02" value="1.10">
    </div>

    <h2>Motion</h2>

    <div class="row">
      <label>twist when extended <span class="v" id="v-twist">0.8°/ring</span></label>
      <input type="range" id="twist" min="0" max="3" step="0.05" value="0.8">
    </div>

    <label class="toggle">
      <span>twist only when extended</span>
      <input type="checkbox" id="twist-extended-only" checked>
      <span class="sw"></span>
    </label>

    <h2>Render</h2>

    <div class="row">
      <label>outline darkness <span class="v" id="v-outline">60</span></label>
      <input type="range" id="outline" min="0" max="120" step="2" value="60">
    </div>

    <h2>Presets</h2>
    <div class="preset-row">
      <button data-preset="default">Default</button>
      <button data-preset="loose">Loose float</button>
      <button data-preset="taut">Taut spring</button>
      <button data-preset="floaty">Floaty</button>
    </div>

    <h2>State</h2>
    <div class="row"><label>knob position
      <span class="v" id="v-pos">0, 0</span></label></div>
    <div class="row"><label>extension
      <span class="v" id="v-ext">0%</span></label></div>
    </div><!-- /.panel-body -->
  </div><!-- /.panel -->
</div>

<script src="src.js"></script>

</body>
</html>
