<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Star Fidget — Tuner</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: #0a0612;
    color: #d4cce0;
    user-select: none;
    -webkit-user-select: none;
  }

  .app {
    position: relative;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  .stage {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 35%, #2a1f44 0%, #140a24 60%, #050208 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .arena {
    position: relative;
    border-radius: 24px;
    background:
      radial-gradient(ellipse at 50% 40%, #1a1230 0%, #0d0820 70%, #050210 100%);
    box-shadow:
      0 0 0 1px rgba(140, 110, 200, 0.18) inset,
      0 0 60px rgba(80, 60, 140, 0.25) inset;
    overflow: hidden;
  }
  .arena::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 18px;
    background-image:
      linear-gradient(rgba(140, 110, 200, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(140, 110, 200, 0.06) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  canvas {
    position: absolute;
    left: 0; top: 0;
    cursor: grab;
    touch-action: none;
  }
  canvas.grabbing { cursor: grabbing; }

  .hint {
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0.55;
    line-height: 1.6;
    pointer-events: none;
    width: 100%;
  }
  .hint strong { color: #6dd9a0; font-weight: 500; }
  .hint em     { color: #b89dd9; font-style: normal; }

  /* ——— Open-tool button (shown only when tool window is hidden) ——— */
  .tool-toggle {
    position: absolute;
    top: 16px;
    right: 16px;
    z-index: 30;
    width: 44px;
    height: 44px;
    border-radius: 22px;
    background: rgba(20, 10, 36, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(140, 110, 200, 0.25);
    color: #d4cce0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, opacity 0.18s;
  }
  .tool-toggle:hover {
    background: rgba(40, 25, 70, 0.85);
    border-color: rgba(109, 217, 160, 0.5);
  }
  .tool-toggle svg { width: 20px; height: 20px; }
  .tool-toggle.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* ——— Floating tool window ——— */
  .panel {
    position: absolute;
    /* Default position — JS overrides via top/left when dragged */
    top: 16px;
    right: 16px;
    width: 320px;
    max-height: calc(100vh - 32px);
    background: rgba(16, 10, 31, 0.92);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(140, 110, 200, 0.22);
    border-radius: 12px;
    z-index: 25;
    box-shadow:
      0 16px 48px rgba(0, 0, 0, 0.55),
      0 2px 0 rgba(255, 255, 255, 0.04) inset;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: opacity 0.18s, transform 0.18s;
  }
  .panel.hidden {
    opacity: 0;
    transform: scale(0.96);
    pointer-events: none;
  }
  .panel.collapsed .panel-body { display: none; }

  /* Title bar — drag handle */
  .panel-titlebar {
    display: flex;
    align-items: center;
    padding: 10px 8px 10px 14px;
    background:
      linear-gradient(180deg, rgba(50, 35, 80, 0.6) 0%, rgba(30, 20, 50, 0.4) 100%);
    border-bottom: 1px solid rgba(140, 110, 200, 0.18);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    flex-shrink: 0;
  }
  .panel-titlebar.dragging { cursor: grabbing; }
  .panel-title {
    flex: 1;
    font-size: 12px;
    font-weight: 600;
    color: #d4cce0;
    letter-spacing: 0.04em;
  }
  .panel-title .grip-dots {
    display: inline-block;
    margin-right: 8px;
    color: rgba(180, 160, 220, 0.45);
    font-size: 10px;
    letter-spacing: 1px;
    vertical-align: 1px;
  }
  .panel-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: #b8acd0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 2px;
  }
  .panel-btn:hover {
    background: rgba(140, 110, 200, 0.15);
    color: #e8def5;
  }
  .panel-btn svg { width: 14px; height: 14px; }

  /* Body — scrollable */
  .panel-body {
    overflow-y: auto;
    padding: 14px 16px 20px;
    flex: 1;
    min-height: 0;
  }

  .panel h2 {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #8a7aa8;
    margin: 18px 0 10px;
    font-weight: 600;
  }
  .panel h2:first-of-type { margin-top: 4px; }
  .panel .sub {
    font-size: 11px;
    color: #6a5d80;
    margin-bottom: 6px;
  }

  .row { margin-bottom: 18px; }
  .row label {
    font-size: 12px;
    color: #b8acd0;
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .row label .v {
    color: #6dd9a0;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
  }
  .row input[type=range] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: #2a1f44;
    border-radius: 3px;
    outline: none;
  }
  .row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #6dd9a0;
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(109, 217, 160, 0.18);
  }
  .row input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #6dd9a0;
    cursor: pointer;
    border: none;
    box-shadow: 0 0 0 4px rgba(109, 217, 160, 0.18);
  }

  .toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 12px;
    color: #b8acd0;
    cursor: pointer;
  }
  .toggle input { display: none; }
  .toggle .sw {
    width: 32px; height: 18px;
    background: #2a1f44;
    border-radius: 10px;
    position: relative;
    transition: background 0.15s;
  }
  .toggle .sw::after {
    content: '';
    position: absolute;
    left: 2px; top: 2px;
    width: 14px; height: 14px;
    background: #8a7aa8;
    border-radius: 50%;
    transition: transform 0.15s, background 0.15s;
  }
  .toggle input:checked + .sw {
    background: rgba(109, 217, 160, 0.3);
  }
  .toggle input:checked + .sw::after {
    transform: translateX(14px);
    background: #6dd9a0;
  }

  .preset-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
  }
  .preset-row button {
    background: #1a1230;
    border: 1px solid #2a1f44;
    color: #b8acd0;
    padding: 8px;
    font-size: 11px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .preset-row button:hover {
    background: #2a1f44;
    color: #e8def5;
    border-color: #6dd9a0;
  }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <div class="arena" id="arena">
      <canvas id="cv"></canvas>
    </div>
    <div class="hint">
      one finger to push · <strong>two fingers to twist</strong> · pinch out to extend
    </div>
  </div>

  <button class="tool-toggle" id="tool-toggle" aria-label="Show tools">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
    </svg>
  </button>

  <div class="panel hidden" id="panel">
    <div class="panel-titlebar" id="panel-titlebar">
      <div class="panel-title"><span class="grip-dots">⋮⋮</span>Tuner</div>
      <button class="panel-btn" id="panel-collapse" aria-label="Collapse">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="panel-btn" id="panel-hide" aria-label="Hide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="panel-body" id="panel-body">
      <div class="sub">handle is a 2D joystick · rings respond as it moves</div>

      <h2>Joystick</h2>

      <div class="row">
        <label>float radius (lateral) <span class="v" id="v-float">60</span></label>
        <input type="range" id="float" min="0" max="160" step="2" value="60">
      </div>

      <div class="row">
        <label>max pull-up (vertical) <span class="v" id="v-pull">110</span></label>
        <input type="range" id="pull" min="20" max="220" step="2" value="110">
      </div>

    <div class="row">
      <label>ring follow strength <span class="v" id="v-follow">0.55</span></label>
      <input type="range" id="follow" min="0" max="1.2" step="0.02" value="0.55">
    </div>

    <div class="row">
      <label>follow falloff (outer rings move less) <span class="v" id="v-falloff">1.40</span></label>
      <input type="range" id="falloff" min="0.20" max="3.00" step="0.05" value="1.40">
    </div>

    <div class="row">
      <label>spring stiffness <span class="v" id="v-spring">0.18</span></label>
      <input type="range" id="spring" min="0.02" max="0.50" step="0.01" value="0.18">
    </div>

    <div class="row">
      <label>damping <span class="v" id="v-damp">0.78</span></label>
      <input type="range" id="damp" min="0.50" max="0.98" step="0.01" value="0.78">
    </div>

    <label class="toggle">
      <span>spring back when released</span>
      <input type="checkbox" id="spring-back">
      <span class="sw"></span>
    </label>

    <h2>Shape</h2>

    <div class="row">
      <label>points <span class="v" id="v-points">10</span></label>
      <input type="range" id="points" min="3" max="20" step="1" value="10">
    </div>

    <div class="row">
      <label>inner ratio <span class="v" id="v-ratio">0.78</span></label>
      <input type="range" id="ratio" min="0.40" max="1.00" step="0.01" value="0.78">
    </div>

    <div class="row">
      <label>rings <span class="v" id="v-rings">28</span></label>
      <input type="range" id="rings" min="6" max="60" step="1" value="28">
    </div>

    <div class="row">
      <label>outer radius <span class="v" id="v-outer">170</span></label>
      <input type="range" id="outer" min="80" max="260" step="2" value="170">
    </div>

    <div class="row">
      <label>min radius <span class="v" id="v-min">22</span></label>
      <input type="range" id="min" min="4" max="80" step="1" value="22">
    </div>

    <div class="row">
      <label>spacing play <span class="v" id="v-play">1.10</span></label>
      <input type="range" id="play" min="0.40" max="2.00" step="0.02" value="1.10">
    </div>

    <h2>Motion</h2>

    <div class="row">
      <label>twist when extended <span class="v" id="v-twist">0.8°/ring</span></label>
      <input type="range" id="twist" min="0" max="3" step="0.05" value="0.8">
    </div>

    <label class="toggle">
      <span>twist only when extended</span>
      <input type="checkbox" id="twist-extended-only" checked>
      <span class="sw"></span>
    </label>

    <div class="row">
      <label>spin coast (how long it keeps spinning) <span class="v" id="v-spinCoast">0.96</span></label>
      <input type="range" id="spinCoast" min="0.80" max="0.999" step="0.005" value="0.96">
    </div>

    <div class="row">
      <label>spin sensitivity (gear ratio) <span class="v" id="v-spinSensitivity">1.00</span></label>
      <input type="range" id="spinSensitivity" min="0.25" max="4.0" step="0.05" value="1.0">
    </div>

    <div class="row">
      <label>volume <span class="v" id="v-volume">0.80</span></label>
      <input type="range" id="volume" min="0" max="1" step="0.05" value="0.8">
    </div>

    <label class="toggle">
      <span>sound</span>
      <input type="checkbox" id="sound-enabled" checked>
      <span class="sw"></span>
    </label>

    <h2>Render</h2>

    <div class="row">
      <label>outline darkness <span class="v" id="v-outline">60</span></label>
      <input type="range" id="outline" min="0" max="120" step="2" value="60">
    </div>

    <h2>Presets</h2>
    <div class="preset-row">
      <button data-preset="default">Default</button>
      <button data-preset="loose">Loose float</button>
      <button data-preset="taut">Taut spring</button>
      <button data-preset="floaty">Floaty</button>
    </div>

    <h2>State</h2>
    <div class="row"><label>knob position
      <span class="v" id="v-pos">0, 0</span></label></div>
    <div class="row"><label>extension
      <span class="v" id="v-ext">0%</span></label></div>
    <div class="preset-row">
      <button id="btn-reset">Reset to center</button>
    </div>
    </div><!-- /.panel-body -->
  </div><!-- /.panel -->
</div>

<script>
(() => {
  // ——— Floating tool window ———
  const panel       = document.getElementById('panel');
  const titlebar    = document.getElementById('panel-titlebar');
  const collapseBtn = document.getElementById('panel-collapse');
  const hideBtn     = document.getElementById('panel-hide');
  const toolToggle  = document.getElementById('tool-toggle');

  // Show / hide
  function showPanel() {
    panel.classList.remove('hidden');
    toolToggle.classList.add('hidden');
  }
  function hidePanel() {
    panel.classList.add('hidden');
    toolToggle.classList.remove('hidden');
  }
  hideBtn.addEventListener('click', hidePanel);
  toolToggle.addEventListener('click', showPanel);
  // Initial state: panel hidden, wrench toggle visible
  // (panel starts with class="panel hidden" in HTML)

  // Collapse / expand (just hides body, keeps title bar)
  collapseBtn.addEventListener('click', () => {
    panel.classList.toggle('collapsed');
  });

  // Drag to move via title bar
  let draggingPanel = false;
  let dragOffsetX = 0, dragOffsetY = 0;

  function panelDown(clientX, clientY) {
    // Convert current right-anchored position to left-anchored so we can move freely
    const rect = panel.getBoundingClientRect();
    panel.style.left = rect.left + 'px';
    panel.style.top  = rect.top + 'px';
    panel.style.right = 'auto';
    dragOffsetX = clientX - rect.left;
    dragOffsetY = clientY - rect.top;
    draggingPanel = true;
    titlebar.classList.add('dragging');
  }
  function panelMove(clientX, clientY) {
    if (!draggingPanel) return;
    const rect = panel.getBoundingClientRect();
    let newLeft = clientX - dragOffsetX;
    let newTop  = clientY - dragOffsetY;
    // Clamp within viewport
    const maxLeft = window.innerWidth  - rect.width;
    const maxTop  = window.innerHeight - 60; // keep title bar reachable
    newLeft = Math.max(0, Math.min(maxLeft, newLeft));
    newTop  = Math.max(0, Math.min(maxTop, newTop));
    panel.style.left = newLeft + 'px';
    panel.style.top  = newTop + 'px';
  }
  function panelUp() {
    draggingPanel = false;
    titlebar.classList.remove('dragging');
  }

  titlebar.addEventListener('mousedown', e => {
    // Ignore clicks on the buttons inside the title bar
    if (e.target.closest('.panel-btn')) return;
    panelDown(e.clientX, e.clientY);
    e.preventDefault();
  });
  titlebar.addEventListener('touchstart', e => {
    if (e.target.closest('.panel-btn')) return;
    const t = e.touches[0];
    panelDown(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('mousemove', e => panelMove(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => {
    if (!draggingPanel) return;
    const t = e.touches[0];
    panelMove(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });
  window.addEventListener('mouseup', panelUp);
  window.addEventListener('touchend', panelUp);

  // Esc to hide
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!panel.classList.contains('hidden')) hidePanel();
      else showPanel();
    }
  });

  const arena = document.getElementById('arena');
  const cv    = document.getElementById('cv');
  const ctx   = cv.getContext('2d');
  const DPR   = Math.min(window.devicePixelRatio || 1, 2);

  function sizeArena() {
    const w = Math.min(window.innerWidth - 40, 720);
    const h = Math.min(window.innerHeight - 40, 720);
    arena.style.width  = w + 'px';
    arena.style.height = h + 'px';
    cv.style.width  = w + 'px';
    cv.style.height = h + 'px';
    cv.width  = w * DPR;
    cv.height = h * DPR;
  }
  sizeArena();
  window.addEventListener('resize', sizeArena);

  const params = {
    float: 60,
    pull: 110,
    follow: 0.55,
    falloff: 1.40,
    spring: 0.18,
    damp: 0.78,
    springBack: false,

    points: 10,
    ratio: 0.78,
    rings: 28,
    outer: 170,
    min: 22,
    play: 1.10,

    twist: 0.8,
    twistExtendedOnly: true,
    spinCoast: 0.96,
    spinSensitivity: 1.0,
    soundEnabled: true,
    volume: 0.8,

    outline: 60,
  };

  const bind = (id, key, parse, fmt) => {
    const el = document.getElementById(id);
    const vEl = document.getElementById('v-' + id);
    el.addEventListener('input', () => {
      params[key] = parse(el.value);
      if (vEl) vEl.textContent = fmt ? fmt(params[key]) : params[key];
    });
  };
  bind('float',  'float',  v => +v);
  bind('pull',   'pull',   v => +v);
  bind('follow', 'follow', v => +v, v => v.toFixed(2));
  bind('falloff','falloff',v => +v, v => v.toFixed(2));
  bind('spring', 'spring', v => +v, v => v.toFixed(2));
  bind('damp',   'damp',   v => +v, v => v.toFixed(2));
  bind('points', 'points', v => +v);
  bind('ratio',  'ratio',  v => +v, v => v.toFixed(2));
  bind('rings',  'rings',  v => +v);
  bind('outer',  'outer',  v => +v);
  bind('min',    'min',    v => +v);
  bind('play',   'play',   v => +v, v => v.toFixed(2));
  bind('twist',  'twist',  v => +v, v => v.toFixed(2) + '°/ring');
  bind('spinCoast',       'spinCoast',       v => +v, v => v.toFixed(3));
  bind('spinSensitivity', 'spinSensitivity', v => +v, v => v.toFixed(2));
  bind('outline','outline',v => +v);
  document.getElementById('volume').addEventListener('input', e => {
    params.volume = +e.target.value;
    document.getElementById('v-volume').textContent = params.volume.toFixed(2);
    if (masterGain) masterGain.gain.value = params.volume;
  });

  document.getElementById('twist-extended-only').addEventListener('change', e => {
    params.twistExtendedOnly = e.target.checked;
  });
  document.getElementById('spring-back').addEventListener('change', e => {
    params.springBack = e.target.checked;
  });

  const presets = {
    default: { float: 60,  pull: 110, follow: 0.55, falloff: 1.40,
               spring: 0.18, damp: 0.78 },
    loose:   { float: 130, pull: 180, follow: 0.75, falloff: 1.10,
               spring: 0.10, damp: 0.85 },
    taut:    { float: 35,  pull: 70,  follow: 0.40, falloff: 2.00,
               spring: 0.32, damp: 0.65 },
    floaty:  { float: 90,  pull: 140, follow: 0.65, falloff: 0.90,
               spring: 0.06, damp: 0.92 },
  };
  for (const btn of document.querySelectorAll('[data-preset]')) {
    btn.addEventListener('click', () => {
      const p = presets[btn.dataset.preset];
      Object.assign(params, p);
      for (const k of Object.keys(p)) {
        const slider = document.getElementById(k);
        if (slider) {
          slider.value = p[k];
          slider.dispatchEvent(new Event('input'));
        }
      }
    });
  }

  document.getElementById('btn-reset').addEventListener('click', () => {
    kx = 0; ky = 0; kz = 0;
    vx = 0; vy = 0; vz = 0;
    userSpin = 0; userSpinVel = 0;
    target = null;
    mode = 'idle';
  });

  document.getElementById('sound-enabled').addEventListener('change', e => {
    params.soundEnabled = e.target.checked;
  });

  // ——— Web Audio: metallic click synthesizer ———
  let audioCtx = null;
  let spinGain = null, spinFilter = null;
  let masterGain = null;

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();

    // iOS requires playing a silent buffer to unlock the audio hardware
    const unlock = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
    const unlockSrc = audioCtx.createBufferSource();
    unlockSrc.buffer = unlock;
    unlockSrc.connect(audioCtx.destination);
    unlockSrc.start(0);

    // Continuous metallic shimmer for spin — high-Q resonant noise
    const bufLen = audioCtx.sampleRate * 2;
    const noiseBuf = audioCtx.createBuffer(1, bufLen, audioCtx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) nd[i] = Math.random() * 2 - 1;
    const noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = noiseBuf;
    noiseNode.loop = true;

    spinFilter = audioCtx.createBiquadFilter();
    spinFilter.type = 'bandpass';
    spinFilter.frequency.value = 3200;
    spinFilter.Q.value = 18;          // narrow & resonant = metallic shimmer

    masterGain = audioCtx.createGain();
    masterGain.gain.value = params.volume;
    masterGain.connect(audioCtx.destination);

    spinGain = audioCtx.createGain();
    spinGain.gain.value = 0;

    noiseNode.connect(spinFilter);
    spinFilter.connect(spinGain);
    spinGain.connect(masterGain);
    noiseNode.start();
  }

  // Simple click: short noise burst through a high-pass filter
  // Continuous pitch mapping — no discrete notes, just smooth physical variation
  function posFreq() {
    const dist = Math.hypot(kx, ky);
    // 150 Hz (center) → 480 Hz (far out), logarithmic so it feels even
    return 150 * Math.pow(3.2, Math.min(dist / 200, 1));
  }

  function spinFreq() {
    // Spin cycles through a narrow range — just enough movement to feel alive
    const t = (((userSpin % 360) + 360) % 360) / 360;
    return 180 * Math.pow(2.2, t);
  }

  // Dry physical click: short sine burst, no harmonics, fast decay
  function playClick(vol = 1.0, freq = 300) {
    if (!audioCtx || !params.soundEnabled) return;
    const t = audioCtx.currentTime;
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol * 0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.065);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(t);
    osc.stop(t + 0.07);
  }

  // Soft descending ping on fling release
  function playFling(vel) {
    if (!audioCtx || !params.soundEnabled) return;
    const t = audioCtx.currentTime;
    const strength = Math.min(1.0, Math.abs(vel) / 12);
    const startFreq = 1800 + strength * 1400;
    [[startFreq, 0.22], [startFreq * 1.52, 0.12], [startFreq * 2.3, 0.07]].forEach(([f, g]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      osc.frequency.exponentialRampToValueAtTime(f * 0.4, t + 0.35);
      gain.gain.setValueAtTime(g * strength, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(t);
      osc.stop(t + 0.4);
    });
  }

  // ——— Color (metallic anodized blue→teal→green) ———
  // Gradient goes from purple at the outer edge into bright green at the center,
  // so the innermost rings stay in the highlight range and don't read as a
  // separate dark shape sitting on top of the puzzle.
  const stops = [
    [0.00, [58,  45, 106]],   // outer: deep purple
    [0.18, [45,  77, 138]],   // blue
    [0.40, [45, 138, 168]],   // teal
    [0.65, [78, 195, 184]],   // cyan-green
    [0.85, [120, 220, 165]],  // green
    [1.00, [160, 235, 180]],  // innermost: bright pale green highlight
  ];
  function colorAt(t) {
    t = ((t % 1) + 1) % 1;
    for (let i = 0; i < stops.length - 1; i++) {
      const [t0, c0] = stops[i];
      const [t1, c1] = stops[i + 1];
      if (t >= t0 && t <= t1) {
        const f = (t - t0) / (t1 - t0);
        return [
          Math.round(c0[0] + (c1[0] - c0[0]) * f),
          Math.round(c0[1] + (c1[1] - c0[1]) * f),
          Math.round(c0[2] + (c1[2] - c0[2]) * f),
        ];
      }
    }
    return stops[0][1];
  }

  function starVertices(cx, cy, outerR, innerR, points, rotationRad) {
    const verts = [];
    const total = points * 2;
    for (let i = 0; i < total; i++) {
      const r = i % 2 === 0 ? outerR : innerR;
      const a = -Math.PI / 2 + rotationRad + (i / total) * Math.PI * 2;
      verts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
    return verts;
  }

  // ——— Joystick state ———
  // knob position relative to puzzle center, in screen pixels.
  // (kx, ky) is the lateral offset; kz is the pull-up height.
  let kx = 0, ky = 0, kz = 0;
  // Velocities for spring-back
  let vx = 0, vy = 0, vz = 0;
  // Target (when dragging), null otherwise
  let target = null;

  // Click accumulators — fire a click every CLICK_PX of lateral movement
  // or every CLICK_DEG of spin. Tracks previous positions to compute deltas.
  let prevKx = 0, prevKy = 0, prevSpin = 0;
  let clickAccumMove = 0, clickAccumSpin = 0;
  const CLICK_PX  = 16;   // lateral pixels per click
  const CLICK_DEG = 9;    // spin degrees per click

  // User-driven spin (degrees). Two-finger twist accumulates here. Persists
  // when fingers lift, so you can twist and let it sit.
  let userSpin = 0;
  let userSpinVel = 0;

  // Mode: 'idle' | 'one' | 'two'
  let mode = 'idle';

  // One-finger drag state
  let dragStartKx = 0, dragStartKy = 0, dragStartKz = 0;
  let dragStartPx = 0, dragStartPy = 0;

  // Two-finger gesture state
  let gestureStartAngle = 0;
  let gestureStartDist  = 0;
  let gestureStartSpin  = 0;
  let gestureStartKz    = 0;
  let lastGestureAngle  = 0;

  function pointerCount(e) {
    if (e.touches) return e.touches.length;
    return 1;
  }
  function pointAt(e, i) {
    if (e.touches) return e.touches[i];
    return e;
  }
  function twoFingerCenter(e) {
    const a = e.touches[0], b = e.touches[1];
    return { x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 };
  }
  function twoFingerAngle(e) {
    const a = e.touches[0], b = e.touches[1];
    return Math.atan2(b.clientY - a.clientY, b.clientX - a.clientX);
  }
  function twoFingerDist(e) {
    const a = e.touches[0], b = e.touches[1];
    return Math.hypot(b.clientX - a.clientX, b.clientY - a.clientY);
  }

  // Start single-finger joystick drag from a point
  function startOne(clientX, clientY) {
    initAudio();
    mode = 'one';
    target = { x: kx, y: ky, z: kz };
    dragStartKx = kx; dragStartKy = ky; dragStartKz = kz;
    dragStartPx = clientX; dragStartPy = clientY;
    cv.classList.add('grabbing');
  }

  // Start two-finger twist+spread gesture
  function startTwo(e) {
    initAudio();
    mode = 'two';
    target = null;                 // release the joystick target
    gestureStartAngle = twoFingerAngle(e);
    gestureStartDist  = twoFingerDist(e);
    gestureStartSpin  = userSpin;
    gestureStartKz    = kz;
    lastGestureAngle  = gestureStartAngle;
    userSpinVel = 0;
    cv.classList.add('grabbing');
  }

  function updateOne(clientX, clientY) {
    const totalDx = clientX - dragStartPx;
    const totalDy = clientY - dragStartPy;
    const nz = Math.max(-params.pull, Math.min(params.pull, dragStartKz - totalDy * 0.8));
    target = {
      x: dragStartKx + totalDx,
      y: dragStartKy + totalDy,
      z: nz,
    };
  }

  function updateTwo(e) {
    // Rotation: track the change in angle between the two fingers.
    // Use delta-from-last-frame so we get reliable velocity for fling/spin.
    const ang = twoFingerAngle(e);
    let dAng = ang - lastGestureAngle;
    // Wrap to (-pi, pi)
    if (dAng >  Math.PI) dAng -= Math.PI * 2;
    if (dAng < -Math.PI) dAng += Math.PI * 2;
    const degDelta = dAng * (180 / Math.PI) * params.spinSensitivity;
    userSpin   += degDelta;
    userSpinVel = degDelta; // deg/frame
    lastGestureAngle = ang;

    // Spread: pinch out → extend (kz). Pinch in → collapse.
    const dist = twoFingerDist(e);
    const distDelta = dist - gestureStartDist;
    // Map: 1px of spread ≈ 1px of pull, clamped to [0, params.pull]
    const newKz = Math.max(0, Math.min(params.pull, gestureStartKz + distDelta));
    target = { x: kx, y: ky, z: newKz };
  }

  function endAll() {
    if (mode === 'two' && Math.abs(userSpinVel) > 2) {
      playFling(userSpinVel);
    }
    mode = 'idle';
    target = null;
    cv.classList.remove('grabbing');
  }

  function onTouchStart(e) {
    e.preventDefault();
    if (e.touches.length >= 2) {
      startTwo(e);
    } else {
      const p = e.touches[0];
      startOne(p.clientX, p.clientY);
    }
  }
  function onTouchMove(e) {
    e.preventDefault();
    if (e.touches.length >= 2) {
      // If we were in one-finger mode, switch to two-finger
      if (mode !== 'two') startTwo(e);
      else updateTwo(e);
    } else if (e.touches.length === 1 && mode === 'one') {
      const p = e.touches[0];
      updateOne(p.clientX, p.clientY);
    } else if (e.touches.length === 1 && mode === 'two') {
      // Lifted one of two fingers — settle into single-finger mode from the
      // remaining touch's current position.
      const p = e.touches[0];
      startOne(p.clientX, p.clientY);
    }
  }
  function onTouchEnd(e) {
    if (e.touches.length === 0) endAll();
  }

  // Mouse fallback for desktop testing
  function onMouseDown(e) {
    startOne(e.clientX, e.clientY);
    e.preventDefault();
  }
  function onMouseMove(e) {
    if (mode === 'one') updateOne(e.clientX, e.clientY);
  }
  function onMouseUp() { endAll(); }

  cv.addEventListener('mousedown',  onMouseDown);
  window.addEventListener('mousemove',  onMouseMove);
  window.addEventListener('mouseup',    onMouseUp);
  cv.addEventListener('touchstart', onTouchStart, { passive: false });
  cv.addEventListener('touchmove',  onTouchMove,  { passive: false });
  cv.addEventListener('touchend',   onTouchEnd,   { passive: false });
  cv.addEventListener('touchcancel',onTouchEnd,   { passive: false });

  // ——— UI labels ———
  const posLabel = document.getElementById('v-pos');
  const extLabel = document.getElementById('v-ext');

  // ——— Render loop ———
  function tick() {
    // Spring physics on knob
    const stiff = params.spring;
    const damp  = params.damp;
    if (target) {
      // Critically pull toward target
      vx += (target.x - kx) * stiff;
      vy += (target.y - ky) * stiff;
      vz += (target.z - kz) * stiff;
    } else if (params.springBack) {
      // Pull back to center (0,0,0)
      vx += (0 - kx) * stiff;
      vy += (0 - ky) * stiff;
      vz += (0 - kz) * stiff;
    }
    vx *= damp; vy *= damp; vz *= damp;
    kx += vx;   ky += vy;   kz += vz;

    // Spin momentum: when not actively twisting, decay velocity and keep coasting.
    // No spring-back on rotation — the puzzle just keeps the orientation it was left in.
    if (mode !== 'two') {
      userSpin   += userSpinVel;
      userSpinVel *= params.spinCoast;  // friction / coast
      if (Math.abs(userSpinVel) < 0.005) userSpinVel = 0;
    }

    // Movement clicks — fire once per CLICK_PX of lateral travel or CLICK_DEG of spin
    if (audioCtx && params.soundEnabled) {
      const moveDelta = Math.hypot(kx - prevKx, ky - prevKy);
      clickAccumMove += moveDelta;
      if (clickAccumMove >= CLICK_PX) {
        clickAccumMove -= CLICK_PX;
        const speed = Math.hypot(vx, vy);
        playClick(Math.min(0.9, 0.25 + speed * 0.08), posFreq());
      }
      const spinDelta = Math.abs(userSpin - prevSpin);
      clickAccumSpin += spinDelta;
      if (clickAccumSpin >= CLICK_DEG) {
        clickAccumSpin -= CLICK_DEG;
        playClick(Math.min(0.8, 0.2 + Math.abs(userSpinVel) * 0.04), spinFreq());
      }
    }
    prevKx = kx; prevKy = ky; prevSpin = userSpin;

    // Spin shimmer disabled — ratchet clicks only
    if (spinGain) spinGain.gain.value = 0;

    posLabel.textContent =
      `${kx.toFixed(0)}, ${ky.toFixed(0)}`;
    extLabel.textContent =
      `${Math.round((kz / Math.max(1, params.pull)) * 100)}%`;

    // ——— Draw ———
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.scale(DPR, DPR);

    const cx = cv.clientWidth / 2;
    const cy = cv.clientHeight / 2;

    // Contact shadow
    const extension = Math.max(-1, Math.min(1, kz / Math.max(1, params.pull)));
    const shadowAlpha = 0.55 - extension * 0.25;
    const shadowR = params.outer * 0.95;
    const grd = ctx.createRadialGradient(cx, cy + 6, 0, cx, cy + 6, shadowR);
    grd.addColorStop(0, `rgba(0,0,0,${shadowAlpha})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(cx, cy + 8, shadowR, shadowR * 0.32, 0, 0, Math.PI * 2);
    ctx.fill();

    // Concentric rings — each one shifts toward the knob position by
    // `follow * (1 - t)^falloff`. Inner rings (small t difference from knob)
    // follow MORE; outer rings barely move.
    const N = params.rings;
    const twistDeg = params.twistExtendedOnly
      ? params.twist * extension
      : params.twist;
    const liftMax = extension * params.outer * 0.85;

    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);              // 0 outer (big) → 1 inner (small)
      const tCurved = Math.pow(t, params.play);
      const rOuter = params.outer - (params.outer - params.min) * tCurved;
      const rInner = rOuter * params.ratio;

      // Follow factor: inner rings (t→1) move most, outer (t→0) move least.
      // pow(t, falloff) grows slowly when falloff is high.
      const follow = params.follow * Math.pow(t, params.falloff);
      const ox = kx * follow;
      const oy = ky * follow;

      // When extended, lift each ring (cone view)
      const liftY = -t * liftMax;

      const ringTwistRad = (i * twistDeg + userSpin) * Math.PI / 180;
      const verts = starVertices(
        cx + ox, cy + oy + liftY,
        rOuter, rInner, params.points, ringTwistRad
      );

      const [r, g, b] = colorAt(t);
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.beginPath();
      ctx.moveTo(verts[0][0], verts[0][1]);
      for (let v = 1; v < verts.length; v++) ctx.lineTo(verts[v][0], verts[v][1]);
      ctx.closePath();
      ctx.fill();

      if (params.outline > 0) {
        ctx.strokeStyle = `rgb(${Math.max(0,r-params.outline)},${Math.max(0,g-params.outline)},${Math.max(0,b-params.outline)})`;
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    // Visualize the float boundary (faint dashed circle) when joystick is active
    if (mode === 'one' || Math.hypot(kx, ky) > 2) {
      ctx.save();
      ctx.strokeStyle = 'rgba(140, 110, 200, 0.18)';
      ctx.setLineDash([4, 6]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(cx, cy, params.float, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Handle is invisible — the joystick is a pure gesture from anywhere on screen.
    // (drawKnob removed; the innermost ring is just the smallest ring.)

    ctx.restore();
    requestAnimationFrame(tick);
  }

  function drawKnob(x, y, extension) {
    // The innermost ring IS the handle. Draw it filled with a slightly
    // brighter version of the metallic color so it reads as "the grabbable bit."
    const rOuter = params.min;
    const rInner = rOuter * params.ratio;
    // Match the twist that the topmost ring has in the rest of the stack
    const twistDeg = params.twistExtendedOnly
      ? params.twist * extension
      : params.twist;
    const ringTwistRad = ((params.rings - 1) * twistDeg) * Math.PI / 180;

    const verts = starVertices(x, y, rOuter, rInner, params.points, ringTwistRad);

    // Lift shadow under the handle when extended
    if (extension > 0.02) {
      ctx.save();
      ctx.shadowColor   = `rgba(0, 0, 0, ${0.4 + extension * 0.3})`;
      ctx.shadowBlur    = 8 + extension * 14;
      ctx.shadowOffsetY = 2 + extension * 6;
      ctx.fillStyle = 'rgba(0,0,0,0.001)'; // shadow needs a fill, but invisible
      ctx.beginPath();
      ctx.moveTo(verts[0][0], verts[0][1]);
      for (let v = 1; v < verts.length; v++) ctx.lineTo(verts[v][0], verts[v][1]);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Brighter version of the innermost ring color so it's visually distinct
    // as the affordance. Same metallic gradient, just lifted toward white.
    const [r, g, b] = colorAt(1.0);
    const lift = 50;
    const br = Math.min(255, r + lift);
    const bg = Math.min(255, g + lift);
    const bb = Math.min(255, b + lift);

    ctx.fillStyle = `rgb(${br},${bg},${bb})`;
    ctx.beginPath();
    ctx.moveTo(verts[0][0], verts[0][1]);
    for (let v = 1; v < verts.length; v++) ctx.lineTo(verts[v][0], verts[v][1]);
    ctx.closePath();
    ctx.fill();

    // Crisp outline so it pops against the ring just below it
    ctx.strokeStyle = `rgba(255, 255, 255, 0.45)`;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // iOS requires audio unlock on every user gesture — attach to the whole
  // document so any tap (canvas, panel, wrench button) guarantees the context
  // is running before the first click sound is needed.
  document.addEventListener('touchstart', initAudio, { passive: true });
  document.addEventListener('mousedown',  initAudio, { passive: true });

  tick();
})();
</script>
</body>
</html>
